version: '3.8'

services:
  backend:
    build: ./backend
    container_name: accessguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - accessguard_data:/data
      - ./secrets:/secrets:ro
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - accessguard

  frontend:
    build: ./frontend
    container_name: accessguard-web
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend
    networks:
      - accessguard

volumes:
  accessguard_data:

networks:
  accessguard:
    driver: bridge
