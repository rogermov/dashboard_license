server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Basic Auth em tudo (SPA + API) — senha em frontend/.htpasswd, que NUNCA
    # vai pro git (está no .gitignore) e chega no servidor via bind mount,
    # igual ao .env/secrets.
    auth_basic "AccessGuard - área restrita";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;

	proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
    # Assets têm hash no nome (muda a cada build) → podem ser cacheados "para sempre".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (e as rotas SPA que caem nele) NUNCA devem ser cacheados, senão o
    # navegador continua carregando os chunks antigos depois de um deploy — era o
    # motivo de o fix do CSV não aparecer sem Ctrl+Shift+R.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
